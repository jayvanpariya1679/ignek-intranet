info:
    description: "EmployeeRest REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "EmployeeRest"
    version: v1.0
openapi: 3.0.1
paths:
  "/get-employee":
    get:
      operationId: getEmployeeById
      parameters:
        - in: query
          name: empId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
            application/xml:
              schema:
                $ref: "#/components/schemas/Employee"
      tags: ["Employee"]
  "/update-employee":
    post:
      operationId: updateEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Employee"
          application/xml:
            schema:
              $ref: "#/components/schemas/Employee"
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
            application/xml:
              schema:
                $ref: "#/components/schemas/Employee"
      tags: ["Employee"]
  "/get-employees":
    get:
      operationId: getEmployees
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Employee"
            application/xml:
              schema:
                items:
                  $ref: "#/components/schemas/Employee"
      tags: ["Employee"]
  "/delete-employee":
    delete:
      operationId: deleteEmployee
      parameters:
        - in: query
          name: empId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: userId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
            application/xml:
              schema:
                $ref: "#/components/schemas/Employee"
      tags: ["Employee"]
components:
  schemas:
    Employee:
      properties:
        userId:
          type: integer
          format: int64
        empId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
        phoneNumber:
          type: integer
          format: int64
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        zipCode:
          type: integer
          format: int64
        designation:
          type: string
        statusCode:
          type: integer
        statusMessage:
          type: string